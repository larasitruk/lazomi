        <script>
// Check the URL for the debug query parameter
const urlParams = new URLSearchParams(window.location.search);

if (urlParams.get('debug') === 'true') {
  // Create a wrapper container so moving from button to tooltip keeps it open
  const container = document.createElement('div');
  Object.assign(container.style, {
    position: 'fixed',
    bottom: '20px',
    right: '20px',
    zIndex: '9999',
    display: 'flex',
    flexDirection: 'column',
    alignItems: 'flex-end', // Aligns both to the right
    gap: '10px'
  });
  document.documentElement.appendChild(container);

  // Create the floating tooltip
  const tooltip = document.createElement('div');
  Object.assign(tooltip.style, {
    padding: '12px',
    backgroundColor: '#0f172a',
    color: '#a7f3d0',
    fontFamily: 'monospace',
    fontSize: '13px',
    borderRadius: '6px',
    whiteSpace: 'pre',
    opacity: '0',
    transform: 'translateY(10px)',
    transition: 'opacity 0.2s, transform 0.2s',
    boxShadow: '0 4px 6px rgba(0,0,0,0.3)',
    pointerEvents: 'none' // Hidden by default so it doesn't block clicks when invisible
  });

  // Append tooltip to the page
  container.appendChild(tooltip);

  // Create the button element
  const colorButton = document.createElement('button');
  colorButton.textContent = 'Randomize Colors';
  Object.assign(colorButton.style, {
    padding: '12px 20px',
    backgroundColor: '#1f2937',
    color: '#ffffff',
    border: 'none',
    borderRadius: '8px',
    cursor: 'pointer',
    fontFamily: 'sans-serif',
    fontWeight: 'bold',
    boxShadow: '0 4px 6px rgba(0,0,0,0.1)'
  });
  container.appendChild(colorButton);

  // Helper function to read the current variables and update the tooltip text
  const showTooltip = () => {
    // getComputedStyle gets the actual applied variables, not just inline ones
    const rootStyles = getComputedStyle(document.documentElement);
    const surround = rootStyles.getPropertyValue('--color-surround').trim() || 'not set';
    const box = rootStyles.getPropertyValue('--color-box').trim() || 'not set';
    const boxInner = rootStyles.getPropertyValue('--color-box-inner').trim() || 'not set';
    const anim = rootStyles.getPropertyValue('--color-box-animation').trim() || 'not set';
    const primary = rootStyles.getPropertyValue('--color-primary').trim() || 'not set';
    const secondary = rootStyles.getPropertyValue('--color-secondary').trim() || 'not set';

    tooltip.textContent = `@theme {\n  --color-primary: ${primary}\n  --color-secondary: ${secondary}\n  --color-surround: ${surround};\n  --color-box: ${box};\n  --color-box-inner: ${boxInner};\n  --color-box-animation: ${anim};\n}`;
    tooltip.style.opacity = '1';
    tooltip.style.transform = 'translateY(0)';
    tooltip.style.pointerEvents = 'auto';
  };

  const hideTooltip = () => {
    tooltip.style.opacity = '0';
    tooltip.style.transform = 'translateY(10px)';
    tooltip.style.pointerEvents = 'none';
  };
  // Desktop Hover Events
  container.addEventListener('mouseenter', showTooltip);
  container.addEventListener('mouseleave', hideTooltip);

  // Mobile "Tap Out" Event
  // Listens for taps anywhere on the document. If the tap is NOT inside our container, hide it.
  document.addEventListener('touchstart', (e) => {
    if (!container.contains(e.target)) {
      hideTooltip();
    }
  });

  // Helper function to generate a random hex color
  const getRandomHexColor = () => {
    return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
  };

  // Helper to generate HSL colors with specific lightness boundaries
  const getRandomHsl = (minLightness, maxLightness) => {
    const h = Math.floor(Math.random() * 360); // Hue: 0 to 360 (any color)
    const s = Math.floor(Math.random() * 50) + 50; // Saturation: 50% to 100% (keeps them vibrant)
    const l = Math.floor(Math.random() * (maxLightness - minLightness + 1)) + minLightness;

    return `hsl(${h}, ${s}%, ${l}%)`;
  };

  // Getting a random number between two values
  function getRandomArbitrary(min, max) {
    return Math.random() * (max - min) + min;
  }

  // Add the click event listener
  colorButton.addEventListener('click', () => {
    const root = document.documentElement;

    // Randomly decide if the main box should be dark or light
    const isBoxDark = Math.random() > 0.5;
    // Force strict separation in Lightness (L) values
    const boxColor = isBoxDark ? getRandomHsl(10, 35) : getRandomHsl(75, 95);
    const primaryColor = isBoxDark ? getRandomHsl(75, 85) : getRandomHsl(10, 35);
    const innerColor = getRandomHsl(75, 95);

    // Apply the variables
    root.style.setProperty('--color-box', boxColor);
    root.style.setProperty('--color-box-inner', innerColor);
    root.style.setProperty('--color-primary', primaryColor);

    const isSurroundDark = Math.random() > 0.5;
    const surroundColor = isBoxDark ? getRandomHsl(10, 35) : getRandomHsl(75, 95);
    const secondaryColor = isBoxDark ? getRandomHsl(75, 95) : getRandomHsl(10, 35);
    root.style.setProperty('--color-surround', surroundColor);
    root.style.setProperty('--color-secondary', secondaryColor);

    root.style.setProperty('--color-box-animation', getRandomHsl(30, 60));

    // Update the tooltip immediately so you don't have to move the mouse away and back
    showTooltip();
  });
}
</script>
